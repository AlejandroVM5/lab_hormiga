<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configurar Hormiga Charlie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Insertamos Fragmento Navbar -->
    <div th:replace="~{fragments/componentes :: navbar}"></div>

    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4 text-center">Configuración de la "Isla del Capricho"</h2>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="card shadow p-4">
            <form th:action="@{/hormiga/iniciar}" method="POST" th:object="${config}">
                
                <div class="mb-3 row">
                    <label class="col-sm-6 col-form-label">Dimensión inicial de la zona:</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" th:field="*{dimension}" placeholder="ej: 5,5" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-6 col-form-label">Aumento de visión de la hormiga:</label>
                    <div class="col-sm-6">
                        <input type="number" class="form-control" th:field="*{aumentoVision}" placeholder="ej: 4" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-6 col-form-label">Posición inicial de la hormiga:</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" th:field="*{posicionInicial}" placeholder="ej: 2,2" required>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-6 col-form-label">Dirección inicial de la hormiga:</label>
                    <div class="col-sm-6">
                        <select class="form-select" th:field="*{direccionInicial}">
                            <option value="U">Up (Arriba)</option>
                            <option value="D">Down (Abajo)</option>
                            <option value="L">Left (Izquierda)</option>
                            <option value="R">Right (Derecha)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4 row">
                    <label class="col-sm-6 col-form-label">Pasos por actualización:</label>
                    <div class="col-sm-6">
                        <input type="number" class="form-control" th:field="*{movimientosVista}" placeholder="ej: 10" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold">Configurar e Iniciar</button>
            </form>
        </div>
    </div>

</body>
</html>
