<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador - Hormiga Charlie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Insertamos Fragmento Navbar -->
    <div th:replace="~{fragments/componentes :: navbar}"></div>

    <div class="container text-center mt-4">
        
        <!-- Panel superior de Controles -->
        <div class="mb-4 d-flex justify-content-center align-items-center gap-4">
            <form th:action="@{/hormiga/avanzar}" method="POST" class="d-flex align-items-center">
                <label class="fw-bold me-2">Cantidad de fotos por actualización:</label>
                <!-- Usamos el valor guardado en sesión -->
                <input type="number" name="pasos" class="form-control me-3" style="width: 80px;" th:value="${pasos}" required>
                <button type="submit" class="btn btn-primary fw-bold">Iniciar / Avanzar</button>
            </form>
            <a href="/hormiga/configurar" class="btn btn-secondary">Reiniciar</a>
        </div>

        <!-- Inyectamos el Fragmento de la Matriz usando el TableroDto -->
        <div class="mt-4" style="overflow-x: auto;">
            <div th:replace="~{fragments/componentes :: matrizFrag(${tablero})}"></div>
        </div>

    </div>

</body>
</html>
